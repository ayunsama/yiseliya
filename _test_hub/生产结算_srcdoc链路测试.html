var FRONTEND = "```html\n<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>生产结算<\/title>\n    <style>\n        * { margin: 0; padding: 0; box-sizing: border-box; }\n        body { background: transparent; display: flex; justify-content: center; align-items: flex-start; padding: 8px; font-family: \"Noto Serif SC\", \"Source Han Serif SC\", \"华文中宋\", \"楷体\", serif; font-weight: 600; }\n        .stage { width: 100%; max-width: 760px; }\n        .scroll-frame { position: relative; padding: 16px 0 20px; }\n        .scroll { width: 100%; position: relative; overflow: hidden; border-radius: 3px; }\n        .content { position: relative; z-index: 2; line-height: 1.85; font-size: 0.95em; animation: scrollIn .65s ease-out; }\n        @keyframes scrollIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }\n\n        .scroll {\n            padding: 42px 30px 48px;\n            background:\n                radial-gradient(ellipse at center, transparent 52%, rgba(96,60,20,.20) 100%),\n                url('data:image/svg+xml;utf8,<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"120\" height=\"120\" viewBox=\"0 0 120 120\"><filter id=\"noise\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.55\" numOctaves=\"4\" stitchTiles=\"stitch\"/><\/filter><rect width=\"120\" height=\"120\" filter=\"url(%23noise)\" opacity=\"0.06\"/><\/svg>'),\n                repeating-linear-gradient(0deg, transparent, transparent 26px, rgba(140,100,50,.04) 26px, rgba(140,100,50,.04) 27px),\n                #f5ead0;\n            color: #3a2718; border: 1px solid #a07840; border-top: 4px double #5a3a1a; border-bottom: 4px double #5a3a1a;\n            box-shadow: 0 12px 30px rgba(0,0,0,.38), inset 0 0 50px rgba(120,80,30,.07), inset 0 -18px 40px rgba(120,80,30,.10);\n        }\n        .stain { position: absolute; border-radius: 50%; pointer-events: none; z-index: 1; }\n        .stain-1 { width: 190px; height: 190px; right: -40px; top: -34px; background: radial-gradient(circle, rgba(150,110,60,.11), transparent 68%); }\n        .stain-2 { width: 150px; height: 150px; left: -36px; bottom: 6px; background: radial-gradient(circle, rgba(120,90,50,.09), transparent 66%); }\n        .scroll::before { content: \"❦\"; position: absolute; top: 6px; left: 12px; font-size: 14px; color: #a07828; opacity: .55; z-index: 3; }\n        .roller { position: absolute; left: 0; right: 0; height: 14px; background: linear-gradient(180deg,#8a5a2a,#6b3f1c 45%,#8a5a2a 92%); border-radius: 7px; box-shadow: 0 2px 5px rgba(0,0,0,.45), inset 0 1px 2px rgba(255,255,255,.28); z-index: 4; }\n        .roller-top { top: 2px; } .roller-bottom { bottom: 6px; }\n        .roller .cap { position: absolute; top: 50%; transform: translateY(-50%); width: 18px; height: 24px; background: linear-gradient(90deg,#7a4a22,#54300f 60%,#7a4a22); border-radius: 4px; box-shadow: 0 2px 4px rgba(0,0,0,.4); }\n        .roller .cap.c-l { left: -10px; } .roller .cap.c-r { right: -10px; }\n        .scroll-header { text-align: center; margin-bottom: 14px; }\n        .head-orn { color: #a07828; letter-spacing: 6px; font-size: .9em; }\n        .head-title { font-size: 1.6em; font-weight: 800; letter-spacing: 10px; color: #5a3a08; text-shadow: 0 1px 0 rgba(255,255,255,.45); }\n        .head-sub { font-size: .78em; color: #8a6a3a; letter-spacing: 2px; margin-top: 5px; }\n        .head-rule { height: 2px; margin: 12px auto 0; width: 82%; background: linear-gradient(90deg, transparent, #c4a050 20%, #d4af37 50%, #c4a050 80%, transparent); }\n\n        .phase-block { position: relative; margin: 10px 0 16px; padding: 10px 14px 12px 12px; background: linear-gradient(135deg, var(--wash, rgba(232,214,178,.32)), rgba(232,214,178,.30)); border: 1px solid rgba(160,120,64,.28); border-left: 3px solid var(--phase, #c4a050); border-radius: 4px; box-shadow: inset 0 1px 8px rgba(120,80,30,.09), inset 0 -2px 10px rgba(120,80,30,.06); }\n        .phase-block::before { content: \"\"; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; background: linear-gradient(180deg, transparent, var(--phase, #c4a050), transparent); border-radius: 2px; }\n        .phase-marker { text-align: center; margin: 2px 0 10px; padding: 4px 0; }\n        .phase-title { display: inline-block; padding: 4px 20px; background: var(--wash, rgba(180,150,60,.16)); border: 1px solid var(--phase, #c4a050); border-radius: 3px; color: #5a3a08; font-weight: 700; font-size: 1.05em; letter-spacing: 4px; box-shadow: 0 1px 3px rgba(120,80,30,.18); }\n        .phase-icon { display: inline-block; margin: 0 6px; font-size: 1em; color: var(--phase, #a07828); }\n        .data-row { display: flex; flex-wrap: wrap; align-items: center; padding: 5px 0 5px 10px; margin: 3px 0; gap: 5px 12px; border-left: 2px solid rgba(160,120,64,.25); border-radius: 0 3px 3px 0; transition: border-left-color .2s, background .2s; }\n        .data-row:hover { background: rgba(255,248,225,.6); border-left-color: #d4af37; }\n        .kv { display: inline-flex; align-items: flex-start; gap: 4px; max-width: 100%; flex-wrap: wrap; word-break: break-word; overflow-wrap: anywhere; }\n        .key { font-weight: 700; color: #3a2718; font-size: .87em; letter-spacing: .5px; flex-shrink: 0; }\n        .key::after { content: \":\"; margin-left: 1px; margin-right: 5px; color: #7a5020; }\n        .val { color: #4a3520; }\n        .key-k-material { color: #8a5a1a; } .key-k-material::after { content: \":\"; color: #8a5a1a; }\n        .key-k-proc { color: #9a4a20; } .key-k-proc::after { content: \":\"; color: #9a4a20; }\n        .key-k-product { color: #1f7a4a; } .key-k-product::after { content: \":\"; color: #1f7a4a; }\n        .key-k-check { color: #5a3a8a; } .key-k-check::after { content: \":\"; color: #5a3a8a; }\n        .tag { display: inline-block; padding: 1px 8px; border-radius: 3px; font-size: .85em; border: 1px solid transparent; white-space: nowrap; }\n        .tag-char { background: rgba(180,150,60,.16); border-color: rgba(180,150,60,.5); color: #6a4a10; }\n        .tag-material { background: rgba(140,90,26,.13); border-color: rgba(140,90,26,.4); color: #7a4a12; }\n        .tag-proc { background: rgba(154,74,32,.12); border-color: rgba(154,74,32,.38); color: #8a3f17; }\n        .tag-succ { background: linear-gradient(180deg, rgba(60,140,80,.18), rgba(60,140,80,.08)); border-color: rgba(40,110,60,.5); color: #1f6a3a; }\n        .tag-fail { background: linear-gradient(180deg, rgba(160,50,40,.16), rgba(160,50,40,.06)); border-color: rgba(140,40,32,.45); color: #8a2418; }\n        .tag-crit { background: linear-gradient(180deg, rgba(212,175,55,.30), rgba(212,175,55,.10)); border-color: #d4af37; color: #7a5510; }\n        .product-row { margin: 8px 0; padding: 10px 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: linear-gradient(120deg, rgba(31,122,74,.13), rgba(212,175,55,.10)); border: 1px solid rgba(31,122,74,.35); border-left: 4px solid #1f7a4a; border-radius: 4px; box-shadow: inset 0 0 16px rgba(31,122,74,.07); }\n        .product-label { font-size: .82em; font-weight: 800; color: #1f6a3a; letter-spacing: 2px; padding: 2px 8px; background: rgba(255,255,255,.5); border: 1px solid rgba(31,122,74,.3); border-radius: 3px; }\n        .product-name { font-size: 1.28em; font-weight: 900; color: #0e5c30; text-shadow: 0 1px 0 rgba(255,255,255,.5), 0 0 12px rgba(31,122,74,.35); letter-spacing: 1px; animation: productGlow 3s ease-in-out infinite; }\n        @keyframes productGlow { 0%,100% { text-shadow: 0 1px 0 rgba(255,255,255,.5), 0 0 8px rgba(31,122,74,.25); } 50% { text-shadow: 0 1px 0 rgba(255,255,255,.6), 0 0 18px rgba(31,122,74,.55); } }\n        .product-attrs { font-size: .88em; color: #4a3520; }\n\n\n        .quality { display: inline-block; padding: 3px 14px; border-radius: 999px; font-weight: 800; letter-spacing: 2px; font-size: .95em; border: 1.5px solid; }\n        .q-普通 { color: #6a6a58; background: linear-gradient(180deg, rgba(120,120,100,.14), rgba(120,120,100,.04)); border-color: #8a8a72; }\n        .q-精良 { color: #2a5a8a; background: linear-gradient(180deg, rgba(50,110,170,.16), rgba(50,110,170,.05)); border-color: #3a7ab0; }\n        .q-稀有 { color: #6a2a9a; background: linear-gradient(180deg, rgba(130,60,180,.16), rgba(130,60,180,.05)); border-color: #8a3ac0; }\n        .q-史诗 { color: #8a5a08; background: linear-gradient(180deg, rgba(212,175,55,.32), rgba(212,175,55,.08)); border-color: #d4af37; box-shadow: 0 0 10px rgba(212,175,55,.35); animation: goldShimmer 2.5s linear infinite; }\n        @keyframes goldShimmer { 0%,100% { box-shadow: 0 0 6px rgba(212,175,55,.30); } 50% { box-shadow: 0 0 16px rgba(212,175,55,.6); } }\n        .q-传说 { color: #b44a08; background: linear-gradient(180deg, rgba(230,120,40,.22), rgba(230,120,40,.06)); border-color: #e07020; box-shadow: 0 0 10px rgba(230,120,40,.4); }\n        .q-神话 { color: #9a1a1a; background: linear-gradient(180deg, rgba(200,40,40,.18), rgba(200,40,40,.05)); border-color: #c03030; box-shadow: 0 0 10px rgba(200,40,40,.4); }\n        .q-唯一 { background: linear-gradient(90deg, #f5d76e, #e8a33d, #c45a3a, #8a4a9a, #3a6ab0); -webkit-background-clip: text; background-clip: text; color: transparent; border-color: #b8882a; filter: drop-shadow(0 0 6px rgba(200,160,60,.5)); }\n        .check-line { margin: 6px 0; padding: 6px 12px; background: rgba(90,58,138,.07); border: 1px solid rgba(90,58,138,.22); border-radius: 4px; font-size: .95em; }\n        .check-dice { font-weight: 800; color: #5a3a8a; }\n        .check-total { font-weight: 900; color: #3a1f6a; }\n        .check-dc { font-weight: 800; color: #8a4a1a; }\n        .arrow-link { color: #9a4a20; font-weight: 700; }\n        .narrative { margin: 8px 0 4px; padding: 8px 12px; font-style: italic; font-size: .86em; color: #5a4433; border-left: 2px solid rgba(140,120,90,.4); background: rgba(140,120,90,.06); }\n        .narrative::before { content: \"✎ 叙事 · \"; color: #a07828; font-style: normal; font-size: .82em; letter-spacing: 1px; }\n        .scroll-footer { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 16px; font-size: .8em; color: #8a6a3a; letter-spacing: 1px; }\n        .foot-seal { width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; color: #f2d8a0; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #a03a2a, #6a1a10 70%); box-shadow: inset 0 2px 6px rgba(255,255,255,.25), 0 2px 5px rgba(0,0,0,.35); }\n        .err-msg { color: #8b2222; text-align: center; font-weight: 600; padding: 20px; }\n        .raw { display: none; }\n        @media (max-width: 560px) { .scroll { padding: 32px 16px 38px; } .head-title { font-size: 1.25em; letter-spacing: 6px; } }\n    <\/style>\n<\/head>\n\n<body>\n    <div class=\"stage\">\n        <div class=\"scroll-frame\">\n            <div class=\"roller roller-top\"><span class=\"cap c-l\"><\/span><span class=\"cap c-r\"><\/span><\/div>\n            <div class=\"scroll\">\n                <div class=\"stain stain-1\"><\/div>\n                <div class=\"stain stain-2\"><\/div>\n                <div class=\"content\" id=\"prodContent\"><\/div>\n            <\/div>\n            <div class=\"roller roller-bottom\"><span class=\"cap c-l\"><\/span><span class=\"cap c-r\"><\/span><\/div>\n        <\/div>\n    <\/div>\n    <div id=\"rawData\" style=\"display:none;\"><生产结算>\n    {锻造结算}\n    | 制作者: [角色] | 类型: 锻造 | 目标: [武器名] | 品类: [刀/剑/枪/锤/弓/杖/斧] |\n    | 材料: [矿石/合金×数量] | 材料消耗: [已消耗] | 工具/工坊: [铁砧/熔炉/便携工具] |\n    | 工序: [熔炼→锻打→淬火→打磨] | 火候: [阶段温度] | 耗时: [时长] |\n    | 检定: 铁匠工具 d20([骰值]) + 修正([数值]) = [总值] vs DC [数值] |\n    | 判定结果: [大成功/成功/失败/大失败] | 品质: [普通/精良/稀有/史诗/传说] |\n    | 成品: [武器名] | 属性: [伤害骰/攻击类型/材质/词条] | 产量: [1] |\n  <\/生产结算>\n  叙事指导: (白描锤击火星、锻打节奏、淬火蒸汽与成品的锋芒)<\/div>\n\n    <script>\n        // ===== 区块配色：生产概览/锻造/炼金/工艺/附魔 =====\n        var PHASE_META = {\n            '生产概览': { icon: '📜', c: '#b8882a' },\n            '锻造结算': { icon: '🔨', c: '#a05030' },\n            '炼金结算': { icon: '⚗️', c: '#3a7a4a' },\n            '工艺结算': { icon: '🛠', c: '#8a5a2a' },\n            '附魔结算': { icon: '✨', c: '#6a4a8a' }\n        };\n        function hexA(hex, a) { var n = parseInt(hex.slice(1), 16); return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; }\n        function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/<\/g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;'); }\n\n        // ===== 解析 <生产结算> 文本 → 结构 =====\n        // 返回 { blocks: [{ name, meta, rows: [[key,value]...], narrative }] }\n        function parseProduction(text) {\n            var out = [];\n            if (!text) return out;\n            // 以 <生产结算> 分割（内容到下一个 <生产结算> 或文本结束）；\n            // 闭合标签 <\/生产结算> 可有可无——因为裸标签注入时浏览器可能把闭合标签丢弃\n            var parts = String(text).split(/<生产结算>\\s*/);\n            // 兼容正则只捕获内层内容（不带 <生产结算> 包裹标签）的情况\n            if (parts.length === 1 && String(text).trim()) parts = ['', String(text)];\n            for (var pi = 1; pi < parts.length; pi++) {\n                var chunk = parts[pi].replace(/<\\/生产结算>\\s*/g, '');\n                // 叙事指导（可能在标签内或标签外）\n                var tailNarr = '';\n                var tm = chunk.match(/叙事指导\\s*[:：]\\s*([\\s\\S]*?)(?=\\n\\s*<生产结算>|$)/);\n                if (tm) tailNarr = tm[1].replace(/^\\(|\\)$/g, '').replace(/[ \\t]+/g, ' ').trim();\n                var blockRe = /\\{([^}]+)\\}([\\s\\S]*?)(?=\\{[^}]+\\}|$)/g, bm;\n                while ((bm = blockRe.exec(chunk)) !== null) {\n                    var name = bm[1].trim();\n                    var body = bm[2] || '';\n                    var meta = PHASE_META[name] || { icon: '⚒', c: '#a07828' };\n                    var rows = [], narrative = '';\n                    body.split(/\\r?\\n/).forEach(function (line) {\n                        line = line.trim();\n                        if (!line) return;\n                        if (/^叙事指导\\s*[:：]/.test(line)) {\n                            narrative = line.replace(/^叙事指导\\s*[:：]\\s*/, '').replace(/^\\(|\\)$/g, '').trim();\n                            return;\n                        }\n                        // | 键: 值 | 键: 值 | 拆分\n                        var segs = line.split('|');\n                        segs.forEach(function (seg) {\n                            seg = seg.trim();\n                            if (!seg) return;\n                            var ci = seg.search(/[:：]/);\n                            if (ci > 0) rows.push([seg.slice(0, ci).trim(), seg.slice(ci + 1).trim()]);\n                            else rows.push(['', seg]);\n                        });\n                    });\n                    if (!narrative && tailNarr) narrative = tailNarr;\n                    out.push({ name: name, meta: meta, rows: rows, narrative: narrative });\n                }\n            }\n            return out;\n        }\n\n        // ===== 键名分类（用于键着色） =====\n        function keyClass(k) {\n            if (/材料|工具|工坊|原料|矿石|消耗/.test(k)) return 'key-k-material';\n            if (/工序|火候|耗时|流程/.test(k)) return 'key-k-proc';\n            if (/成品|目标|属性|效果|产量|产出/.test(k)) return 'key-k-product';\n            if (/检定|判定|骰|修正|DC/.test(k)) return 'key-k-check';\n            return '';\n        }\n        // ===== 值渲染：品质/成品/检定/判定结果/工序等 =====\n        function renderVal(key, value) {\n            var v = esc(value), k = key || '';\n            if (/^品质$/.test(k) && /^(普通|精良|稀有|史诗|传说|神话|唯一)$/.test(value.trim())) {\n                return '<span class=\"quality q-' + value.trim() + '\">✦ ' + esc(value.trim()) + '<\/span>';\n            }\n            if (/^(成品|目标成品|目标)$/.test(k) && value.trim()) {\n                return '<div class=\"product-row\"><span class=\"product-label\">' + (k === '目标成品' ? '目标成品' : (k === '目标' ? '目标' : '成品')) + '<\/span><span class=\"product-name\">' + v + '<\/span><\/div>';\n            }\n            if (/^检定$/.test(k)) {\n                var m = value.match(/([\\u4e00-\\u9fa5·]+工具|[\\u4e00-\\u9fa5]+)\\s*d20\\s*\\(\\s*(\\d+)\\s*\\)\\s*\\+\\s*(\\d+)\\s*=\\s*(\\d+)\\s*vs\\s*DC\\s*(\\d+)/i);\n                if (m) {\n                    return '<div class=\"check-line\">⚄ <span class=\"check-dice\">' + esc(m[1]) + ' d20(' + m[2] + ')<\/span> + <span class=\"check-dice\">' + m[3] + '<\/span> = <span class=\"check-total\">' + m[4] + '<\/span> <span style=\"color:#8a6a3a;\">vs<\/span> DC <span class=\"check-dc\">' + m[5] + '<\/span><\/div>';\n                }\n                return '<span class=\"val\">' + v + '<\/span>';\n            }\n            if (/^判定结果$/.test(k)) {\n                if (/大成功/.test(value)) return '<span class=\"tag tag-crit\">✦ 大成功<\/span>';\n                if (/大失败|大失敗/.test(value)) return '<span class=\"tag tag-fail\">✖ 大失败<\/span>';\n                if (/成功/.test(value)) return '<span class=\"tag tag-succ\">✔ 成功<\/span>';\n                if (/失败/.test(value)) return '<span class=\"tag tag-fail\">✖ 失败<\/span>';\n                return '<span class=\"val\">' + v + '<\/span>';\n            }\n            if (/^(工序|火候)$/.test(k)) {\n                return '<span class=\"val\">' + v.replace(/→|->/g, ' <span class=\"arrow-link\">→<\/span> ') + '<\/span>';\n            }\n            if (/^材料|材料清单|材料消耗|工具|原料/.test(k)) return '<span class=\"tag tag-material\">' + v + '<\/span>';\n            if (/^产量$/.test(k)) return '<span class=\"tag tag-char\">× ' + v + '<\/span>';\n            return '<span class=\"val\">' + v + '<\/span>';\n        }\n\n\n        // ===== 渲染：结构 → 精美卷轴 HTML =====\n        function buildHeadSub() {\n            try {\n                var stat = null;\n                if (typeof Mvu !== 'undefined' && Mvu.getMvuData) stat = (Mvu.getMvuData({ type: 'message', message_id: 'latest' }) || {}).stat_data;\n                var w = (stat && stat.世界) || {};\n                var parts = [];\n                if (w.日期) parts.push(String(w.日期));\n                if (w.时间) parts.push(String(w.时间));\n                var loc = w.当前地点 || w.当前位置;\n                if (loc) parts.push(String(loc));\n                return parts.join(' · ') || '圣光历 · 工匠坊记录';\n            } catch (e) { return '圣光历 · 工匠坊记录'; }\n        }\n        function renderProduction(text) {\n            var blocks = parseProduction(text);\n            if (!blocks.length) return '<div class=\"err-msg\">※ 未发现生产结算记录 ※<\/div>';\n            var typeName = '';\n            blocks.forEach(function (b) { if (b.name !== '生产概览' && !typeName) typeName = b.name.replace('结算', ''); });\n            if (!typeName) typeName = '生产';\n            var html = '<div class=\"scroll-header\"><div class=\"head-orn\">─ ✦ ─<\/div><div class=\"head-title\">' + esc(typeName) + '<\/div><div class=\"head-sub\">' + esc(buildHeadSub()) + '<\/div><div class=\"head-rule\"><\/div><\/div>';\n            blocks.forEach(function (b) {\n                var c = b.meta.c;\n                html += '<div class=\"phase-block\" style=\"--phase:' + c + ';--wash:linear-gradient(135deg,' + hexA(c, .16) + ',' + hexA(c, .05) + ');\">';\n                html += '<div class=\"phase-marker\"><span class=\"phase-icon\">' + b.meta.icon + '<\/span><span class=\"phase-title\">' + esc(b.name) + '<\/span><\/div>';\n                b.rows.forEach(function (pair) {\n                    var key = pair[0], value = pair[1];\n                    if (!key && !value) return;\n                    var rv = renderVal(key, value);\n                    if (rv.indexOf('<div') === 0) {\n                        html += '<div class=\"data-row\">' + (key ? '<span class=\"key ' + keyClass(key) + '\">' + esc(key) + '<\/span>' : '') + rv + '<\/div>';\n                    } else {\n                        html += '<div class=\"data-row\"><span class=\"kv\">' + (key ? '<span class=\"key ' + keyClass(key) + '\">' + esc(key) + '<\/span>' : '') + r
