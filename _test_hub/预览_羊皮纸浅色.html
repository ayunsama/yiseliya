<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>羊皮纸 · 浅色版预览</title>
<style>
  body { background:#7a6a52; padding:24px; font-family: sans-serif; }
  .hint { color:#efe6d0; font-size:12px; margin-bottom:8px; }
</style>
</head>
<body>
  <div class="hint">⬇ 浅色羊皮纸版（羊皮纸日式西幻_浅色）</div>
  <div data-parchment style="
  width: 100%;
  max-width: 100%;
  min-height: 160px;
  margin: 16px auto;
  position: relative;
  overflow: hidden;
  contain: layout paint;
  padding: 18px;
  box-sizing: border-box;
  background:
    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(139, 107, 74, 0.045) 2px,
      rgba(139, 107, 74, 0.045) 4px
    ),
    linear-gradient(165deg, #fbf3e0 0%, #f4e8cd 35%, #eedcc2 70%, #e7d3ac 100%);
  border: 3px double #8b6b4a;
  border-radius: 3px;
  box-shadow:
    0 6px 20px rgba(90, 60, 30, 0.25),
    inset 0 0 40px rgba(160, 120, 70, 0.18),
    0 0 0 1px rgba(139, 107, 74, 0.4);
  font-family: 'ZhuqueFangsong', 'Noto Serif SC', serif;
  color: #4a3623;
">

  <div data-edge style="
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 15% at 50% 0%, rgba(139,107,74,0.20), transparent 70%),
      radial-gradient(ellipse 60% 12% at 50% 100%, rgba(139,107,74,0.16), transparent 70%);
    pointer-events: none;
    z-index: 0;
  "></div>

  <div style="position:absolute;top:-1px;left:-1px;width:44px;height:44px;border-top:3px solid #8b6b4a;border-left:3px solid #8b6b4a;opacity:0.5;z-index:1;border-radius:2px 0 0 0;"></div>
  <div style="position:absolute;top:-1px;right:-1px;width:44px;height:44px;border-top:3px solid #8b6b4a;border-right:3px solid #8b6b4a;opacity:0.5;z-index:1;border-radius:0 2px 0 0;"></div>
  <div style="position:absolute;bottom:-1px;left:-1px;width:44px;height:44px;border-bottom:3px solid #8b6b4a;border-left:3px solid #8b6b4a;opacity:0.5;z-index:1;border-radius:0 0 0 2px;"></div>
  <div style="position:absolute;bottom:-1px;right:-1px;width:44px;height:44px;border-bottom:3px solid #8b6b4a;border-right:3px solid #8b6b4a;opacity:0.5;z-index:1;border-radius:0 0 2px 0;"></div>

  <div style="position:absolute;top:14px;left:55px;right:55px;height:1px;background:linear-gradient(90deg,transparent,#a4845c,transparent);opacity:0.55;z-index:1;"></div>
  <div style="position:absolute;top:18px;left:55px;right:55px;height:1px;background:linear-gradient(90deg,transparent,#a4845c,transparent);opacity:0.35;z-index:1;"></div>

  <div data-title style="
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 12px 0 2px 0;
  ">
    <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:4px;">
      <span style="color:#8b6b4a;font-size:11px;opacity:0.7;">✧</span>
      <div style="width:50px;height:1px;background:linear-gradient(90deg,transparent,#8b6b4a);opacity:0.45;"></div>
      <span style="color:#6b4e31;font-size:10px;letter-spacing:3px;text-transform:uppercase;opacity:0.75;">The Elder Scroll</span>
      <div style="width:50px;height:1px;background:linear-gradient(-90deg,transparent,#8b6b4a);opacity:0.45;"></div>
      <span style="color:#8b6b4a;font-size:11px;opacity:0.7;">✧</span>
    </div>
    <span style="
      display: block;
      font-size: clamp(18px, 3.5vw, 22px);
      color: #6b2e2e;
      text-shadow: 0 1px 2px rgba(139, 107, 74, 0.35);
      font-weight: 500;
      letter-spacing: 10px;
      line-height: 1.2;
      font-family: 'ZhuqueFangsong', 'Noto Serif SC', serif;
    ">◈ 伊 瑟 利 亚 ◈</span>
  </div>

  <div style="
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 4px 0 10px 0;
    opacity: 0.55;
  ">
    <span style="font-size:12px;color:#8b6b4a;">⚔</span>
    <div style="width:30px;height:1px;background:#a4845c;"></div>
    <span style="font-size:10px;color:#8b6b4a;">❖</span>
    <div style="width:30px;height:1px;background:#a4845c;"></div>
    <span style="font-size:12px;color:#8b6b4a;">⚔</span>
  </div>

  <div data-content style="
    position: relative;
    z-index: 2;
    padding: 0 10px;
    line-height: 2.6;
    font-size: 14px;
    color: #4a3623;
    letter-spacing: 0.04em;
    white-space: pre-line;
  ">
清晨的雾霭还缠绕在灰石阵的裂隙间，露水沿着残碑的刻痕滑落。你听见远处传来商队铃铛的轻响——那是通往卡兰蒂亚的旧路。

<strong>伊瑟利亚</strong>大陆的第一缕阳光，正落在你肩头。传闻中<em>本源意志</em>的低语，此刻竟如同亲耳可闻。

> 「异界者，你的命运尚未书写。」

我举起手中的<code>生锈铁剑</code>，剑刃在晨光里泛出微弱的冷光。
  </div>

  <div style="
    position: relative;
    z-index: 2;
    margin-top: 10px;
    text-align: center;
    font-size: 12px;
    color: #8b6b4a;
    opacity: 0.4;
    letter-spacing: 14px;
    font-family: serif;
  ">✧ ◈ ✦ ◈ ✧</div>

  <style>
    [data-parchment] .mes_quote,
    [data-parchment] .quote,
    [data-parchment] q {
      color: #6b4e31 !important;
      font-style: italic;
      border-left: 2px solid #8b6b4a;
      padding-left: 10px;
      background: rgba(139, 107, 74, 0.08);
      display: block;
      margin: 4px 0;
    }
    [data-parchment] span[style*="color"] { color: #4a3623 !important; }
    [data-parchment] .hljs-string { color: #a0601f !important; }
    [data-parchment] .hljs-keyword { color: #8b4513 !important; font-weight: 600; }
    [data-parchment] a { color: #8b4513 !important; text-decoration: underline; text-decoration-color: rgba(139, 107, 74, 0.45); }
    [data-parchment] a:hover { color: #6b2e2e !important; }
    [data-parchment] em,
    [data-parchment] i { font-style: normal; font-weight: 700; color: #8b4513; }
    [data-parchment] strong,
    [data-parchment] b { font-weight: 700; font-style: italic; color: #6b2e2e; }
    [data-parchment] code { background: rgba(139, 107, 74, 0.12); color: #4a3623; padding: 1px 5px; border-radius: 2px; border: 1px solid rgba(139, 107, 74, 0.4); font-size: 0.9em; }
    [data-parchment] p { margin: 8px 0; }
    [data-parchment] ul,
    [data-parchment] ol { padding-left: 1.6em; color: #4a3623; }
    [data-parchment] li { margin: 2px 0; }
    [data-parchment] hr { border: none; height: 1px; background: linear-gradient(90deg, transparent, #a4845c, transparent); margin: 8px 0; opacity: 0.45; }
  </style>
</div>
</body>
</html>
