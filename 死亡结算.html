<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>死亡结算</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Georgia", "Microsoft YaHei", serif;
            background: transparent;
            padding: 8px;
        }

        /* ============================
           方案 A · 卷宗文书（羊皮纸）
        ============================ */

        .pA-panel {
            background: linear-gradient(165deg, #f7ecd4 0%, #f1e2c0 55%, #e9d5ab 100%);
            position: relative;
            overflow: hidden;
            border: 2px solid #a08050;
            outline: 1px solid #cdb487;
            outline-offset: 3px;
            border-radius: 2px;
            padding: 24px 28px 22px;
            box-shadow: 0 6px 18px rgba(0,0,0,.35), inset 0 0 26px rgba(160,128,80,.16);
            max-width: 560px;
            margin: 0 auto;
        }

        .pA-panel::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(rgba(139,107,74,.16) 1px, transparent 1.4px);
            background-size: 22px 22px;
            opacity: .5;
        }

        .pA-panel::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(ellipse at 18% 92%, rgba(120,80,30,.10), transparent 55%),
                radial-gradient(ellipse at 85% 10%, rgba(120,80,30,.08), transparent 50%);
        }

        .pA-corner { position: absolute; width: 26px; height: 26px; z-index: 2; }
        .pA-corner.tl { top: 8px; left: 8px; border-top: 2px solid #7a5c32; border-left: 2px solid #7a5c32; }
        .pA-corner.tr { top: 8px; right: 8px; border-top: 2px solid #7a5c32; border-right: 2px solid #7a5c32; }
        .pA-corner.bl { bottom: 8px; left: 8px; border-bottom: 2px solid #7a5c32; border-left: 2px solid #7a5c32; }
        .pA-corner.br { bottom: 8px; right: 8px; border-bottom: 2px solid #7a5c32; border-right: 2px solid #7a5c32; }

        .pA-seal {
            position: absolute;
            top: 20px;
            right: 22px;
            z-index: 3;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #f7ecd4;
            font-family: "Georgia", serif;
            transform: rotate(10deg);
            opacity: .9;
            box-shadow: inset 0 0 0 2px rgba(0,0,0,.25), 0 2px 5px rgba(0,0,0,.3);
        }

        .pA-death .pA-seal { background: radial-gradient(circle at 35% 30%, #c0492f, #8c2f1c); }
        .pA-rewind .pA-seal { background: radial-gradient(circle at 35% 30%, #7d4fc0, #54307f); }

        .pA-head { text-align: center; position: relative; z-index: 2; }
        .pA-code { font-size: 11px; letter-spacing: 3px; color: #8a6a3f; font-style: italic; margin-bottom: 7px; }
        .pA-title { font-size: 21px; letter-spacing: 10px; color: #5a3d1a; font-weight: 700; text-indent: 10px; }
        .pA-sub { font-size: 10px; letter-spacing: 4px; color: #a08254; margin-top: 6px; }

        .pA-hairline {
            height: 1px;
            margin: 14px 6px 6px;
            position: relative;
            z-index: 2;
            background: linear-gradient(90deg, transparent, #b6925f 30%, #8a6a3f 50%, #b6925f 70%, transparent);
        }

        .pA-hairline::before {
            content: '◆';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -60%);
            color: #8a6a3f;
            font-size: 8px;
            background: #f1e2c0;
            padding: 0 10px;
        }

        .pA-body { margin-top: 8px; position: relative; z-index: 2; }

        .pA-row {
            display: flex;
            align-items: baseline;
            padding: 9px 2px;
            border-bottom: 1px dashed rgba(139,107,74,.4);
        }

        .pA-row:last-child { border-bottom: none; }

        .pA-k { font-size: 11px; color: #8a6a3f; letter-spacing: 1px; min-width: 86px; flex-shrink: 0; font-style: italic; }
        .pA-v { font-size: 13px; color: #4a3623; line-height: 1.7; padding-left: 10px; }
        .pA-v.strong { color: #a0311f; font-weight: 700; }
        .pA-rewind .pA-v.strong { color: #6b3fa0; }
        .pA-v.dim { color: #7d6a50; font-style: italic; }

        .pA-eval {
            margin-top: 14px;
            padding: 10px 14px 10px 16px;
            position: relative;
            z-index: 2;
            border-left: 3px solid #a0311f;
            background: rgba(255,250,240,.55);
            font-size: 12px;
            font-style: italic;
            color: #5a4630;
            line-height: 1.8;
            border-radius: 0 3px 3px 0;
        }

        .pA-rewind .pA-eval { border-left-color: #6b3fa0; }

        .pA-roll {
            margin-top: 10px;
            font-size: 10px;
            color: #a08254;
            letter-spacing: 2px;
            text-align: right;
            font-style: italic;
        }

        /* ============================
           通用
        ============================ */

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #8a6a3f;
            font-family: "Georgia", serif;
            font-size: 12px;
            font-style: italic;
        }

        /* ============================
           手机适配
        ============================ */

        @media screen and (max-width: 480px) {
            body { padding: 4px; }

            .pA-panel {
                max-width: 100%;
                padding: 18px 18px 16px;
            }

            .pA-title { font-size: 17px; letter-spacing: 6px; text-indent: 6px; }
            .pA-seal { width: 44px; height: 44px; font-size: 20px; top: 16px; right: 16px; }
            .pA-code { font-size: 10px; letter-spacing: 2px; }
            .pA-sub { font-size: 9px; letter-spacing: 3px; }
            .pA-k { font-size: 10px; min-width: 70px; }
            .pA-v { font-size: 12px; }
            .pA-eval { font-size: 11px; }
        }
    </style>
</head>
<body>
    <div id="content">
        <div class="loading">— 法则干涉中 —</div>
    </div>

    <script>
        /* ========== 获取消息内容 ========== */
        function getMessageData() {
            var chatMessages = getChatMessages(getCurrentMessageId());
            if (!chatMessages || chatMessages.length === 0) {
                return null;
            }
            return chatMessages[0].message;
        }

        /* ========== 判断类型 ========== */
        function detectType(messageText) {
            if (messageText.indexOf('<档案清算>') !== -1) {
                return 'death';
            }
            if (messageText.indexOf('<回溯结算>') !== -1) {
                return 'rewind';
            }
            return null;
        }

        /* ========== 通用字段提取 ==========
         * 宽容匹配：标签支持多个别名（第一个命中的优先），值取到「|」或换行前。
         * 兼容同一行多个字段：| 个体: X | 终级: Y | 存活: Z |
         * 占位符清理：值整体形如 [xxx]（纯占位符包裹）时剥掉方括号，如 [角色名] → 角色名；
         * 值本身含括号内容（如 Lv.12 [圣骑士]）则保留原样。
         */
        function cleanBrackets(val) {
            var v = String(val || '').trim();
            if (/^\[[^\[\]]*\]$/.test(v)) return v.slice(1, -1).trim();
            return v;
        }
        function grabField(content, labels) {
            for (var i = 0; i < labels.length; i++) {
                var label = labels[i].replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                var re = new RegExp(label + '\\s*[:：]\\s*([^|\\n]+)');
                var m = content.match(re);
                if (m && m[1] !== undefined && m[1].trim() !== '') {
                    return cleanBrackets(m[1]);
                }
            }
            return null;
        }

        /* ========== 解析档案清算 ========== */
        function parseDeathReport(messageText) {
            var result = {};
            var match = messageText.match(/<档案清算>([\s\S]*?)<\/档案清算>/);
            if (!match || !match[1]) return result;
            var content = match[1];

            var codeMatch = content.match(/\{推演代号[:：]\s*([^}]+)\}/);
            result.codename = codeMatch ? codeMatch[1].trim() : '陨落的命轨';

            // 多别名：与数据格式（个体/终级/存活/死因/世界线扰动/总评）对齐，
            // 同时兼容旧标签（陨落个体/最终等级/存活时长/致死原因/最终评价）
            result.name = grabField(content, ['个体', '陨落个体', '角色名']) || '未知';
            result.level = grabField(content, ['终级', '最终等级', '等级']) || '未知';
            result.duration = grabField(content, ['存活', '存活时长', '生存时长']) || '未知';
            result.cause = grabField(content, ['死因', '致死原因']) || '未知';
            result.disturbance = grabField(content, ['世界线扰动', '世界线影响', '世界扰动']) || '未对本源产生明显干涉';
            result.evaluation = grabField(content, ['总评', '最终评价']) || '';

            return result;
        }

        /* ========== 解析回溯结算 ========== */
        function parseRewindData(messageText) {
            var result = {};
            var match = messageText.match(/<回溯结算>([\s\S]*?)<\/回溯结算>/);
            if (!match || !match[1]) return result;
            var content = match[1];

            var subtitleMatch = content.match(/\{([^}]+)\}/);
            result.subtitle = subtitleMatch ? subtitleMatch[1].trim() : '法则干涉: 死亡回溯';

            result.trigger = grabField(content, ['触发者', '回溯者', '被回溯者']) || '未知';
            result.trauma = grabField(content, ['致死创伤记忆', '创伤记忆', '创伤']) || '未知';

            var timeMatch = content.match(/(?:时间回跃|回跃时间|时间回溯|回溯时间)[:：]\s*([^|\n]+)/);
            if (timeMatch) {
                var timeStr = timeMatch[1].trim();
                var parts = timeStr.split(/->|→/);
                if (parts.length === 2) {
                    result.timeFrom = parts[0].trim().replace(/^\[|\]$/g, '').trim();
                    result.timeTo = parts[1].trim().replace(/^\[|\]$/g, '').trim();
                } else {
                    result.timeFrom = timeStr.replace(/^\[|\]$/g, '').trim();
                    result.timeTo = '';
                }
            } else {
                result.timeFrom = '未知';
                result.timeTo = '未知';
            }

            result.dice = grabField(content, ['精神磨损判定', '磨损判定', '判定骰']) || '';
            result.result = grabField(content, ['判定结果', '结果']) || '';
            result.status = grabField(content, ['状态追加', '追加状态', '状态']) || '';

            return result;
        }

        /* ========== 渲染档案清算（方案A 卷宗文书） ========== */
        function renderDeath(data) {
            var html = '';
            html += '<div class="pA-panel pA-death">';
            html += '<span class="pA-corner tl"></span>';
            html += '<span class="pA-corner tr"></span>';
            html += '<span class="pA-corner bl"></span>';
            html += '<span class="pA-corner br"></span>';
            html += '<div class="pA-seal">殁</div>';

            html += '<div class="pA-head">';
            html += '<div class="pA-code">' + (data.codename || '陨落的命轨') + '</div>';
            html += '<div class="pA-title">命轨清算</div>';
            html += '<div class="pA-sub">ARCHIVE · 陨落卷宗</div>';
            html += '</div>';

            html += '<div class="pA-hairline"></div>';

            html += '<div class="pA-body">';
            html += '<div class="pA-row"><span class="pA-k">陨落个体</span><span class="pA-v strong">' + (data.name || '未知') + '</span></div>';
            html += '<div class="pA-row"><span class="pA-k">最终等级</span><span class="pA-v">' + (data.level || '未知') + '</span></div>';
            html += '<div class="pA-row"><span class="pA-k">存活时长</span><span class="pA-v">' + (data.duration || '未知') + '</span></div>';
            html += '<div class="pA-row"><span class="pA-k">致死原因</span><span class="pA-v strong">' + (data.cause || '未知') + '</span></div>';
            html += '<div class="pA-row"><span class="pA-k">世界线扰动</span><span class="pA-v dim">' + (data.disturbance || '未对本源产生明显干涉') + '</span></div>';
            html += '</div>';

            if (data.evaluation) {
                html += '<div class="pA-eval">「' + data.evaluation + '」</div>';
            }

            html += '<div class="pA-roll">—— 本源回廊 · 归档 ——</div>';
            html += '</div>';
            return html;
        }

        /* ========== 渲染回溯结算（方案A 卷宗文书） ========== */
        // 判定结果是否视为「成功」：兼容多种措辞（成功/通过/稳定/生效/幸免/免疫/减免）
        function isSuccessResult(text) {
            if (!text) return false;
            if (/失败|未通过|无效|崩解|失效/.test(text)) return false;
            return /成功|通过|稳定|生效|幸免|免疫|减免/.test(text);
        }

        function renderRewind(data) {
            var isSuccess = isSuccessResult(data.result);
            var html = '';

            html += '<div class="pA-panel pA-rewind">';
            html += '<span class="pA-corner tl"></span>';
            html += '<span class="pA-corner tr"></span>';
            html += '<span class="pA-corner bl"></span>';
            html += '<span class="pA-corner br"></span>';
            html += '<div class="pA-seal">溯</div>';

            html += '<div class="pA-head">';
            html += '<div class="pA-code">' + (data.subtitle || '法则干涉: 死亡回溯') + '</div>';
            html += '<div class="pA-title">亡者回廊</div>';
            html += '<div class="pA-sub">REWIND · 回溯卷宗</div>';
            html += '</div>';

            html += '<div class="pA-hairline"></div>';

            html += '<div class="pA-body">';
            html += '<div class="pA-row"><span class="pA-k">触发者</span><span class="pA-v strong">' + (data.trigger || '未知') + '</span></div>';
            html += '<div class="pA-row"><span class="pA-k">创伤记忆</span><span class="pA-v">' + (data.trauma || '未知') + '</span></div>';
            if (data.timeFrom || data.timeTo) {
                html += '<div class="pA-row"><span class="pA-k">时间回跃</span><span class="pA-v">' + (data.timeFrom || '???') + ' → ' + (data.timeTo || '???') + '</span></div>';
            }
            if (data.dice) {
                var diceText = data.dice;
                if (data.result) {
                    var resColor = isSuccess ? '#2f8f45' : '#c0392b';
                    diceText += ' <span style="color:' + resColor + ';font-weight:700;">' + data.result + '</span>';
                }
                html += '<div class="pA-row"><span class="pA-k">磨损判定</span><span class="pA-v">' + diceText + '</span></div>';
            }
            if (data.status) {
                html += '<div class="pA-row"><span class="pA-k">状态追加</span><span class="pA-v dim">' + data.status + '</span></div>';
            }
            html += '</div>';

            if (data.result) {
                var evalColor = isSuccess ? '#2f8f45' : '#c0392b';
                var evalText = isSuccess ? '时光让步，亡者重临。' : '时光之锚颤动，回溯受限。';
                html += '<div class="pA-eval" style="border-left-color:' + evalColor + ';">' + evalText + '</div>';
            }

            html += '<div class="pA-roll">—— 本源回廊 · 追索 ——</div>';
            html += '</div>';
            return html;
        }

        /* ========== 主函数 ========== */
        function init() {
            try {
                var messageText = getMessageData();
                if (!messageText) {
                    document.getElementById('content').innerHTML = '<div class="loading">\u2014 \u65E0\u6CD5\u83B7\u53D6\u6D88\u606F \u2014</div>';
                    return;
                }

                var type = detectType(messageText);

                if (type === 'death') {
                    var deathData = parseDeathReport(messageText);
                    document.getElementById('content').innerHTML = renderDeath(deathData);
                } else if (type === 'rewind') {
                    var rewindData = parseRewindData(messageText);
                    document.getElementById('content').innerHTML = renderRewind(rewindData);
                } else {
                    document.getElementById('content').innerHTML = '<div class="loading">\u2014 \u672A\u68C0\u6D4B\u5230\u7ED3\u7B97\u6570\u636E \u2014</div>';
                }
            } catch (error) {
                document.getElementById('content').innerHTML = '<div class="loading">\u2014 \u52A0\u8F7D\u5931\u8D25 \u2014</div>';
            }
        }

        $(function() { init(); });
    </script>
</body>
</html>
