# ============================================================
#  小剧场正则表达式
#  将以下内容复制到角色卡 index.yaml 的 扩展字段.正则 中
# ============================================================

    - 正则名称: '[渲染]小剧场'
      id: 6a1b2c3d-1234-5678-9abc-def012345678
      启用: true
      查找表达式: /<(小剧场|元剧场)>([\s\S]*?)</(小剧场|元剧场)>/gsi
      替换为: |-
        <div style="margin:12px 0;padding:14px;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);border:2px solid #e2b96f;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,0.4);position:relative;overflow:hidden;font-family:'Georgia','Noto Serif SC',serif;">
        <div style="text-align:center;color:#e2b96f;font-size:13px;font-weight:bold;letter-spacing:4px;padding-bottom:10px;margin-bottom:10px;border-bottom:1px dashed rgba(226,185,111,0.3);">✦ ✦ ✦ $1 ✦ ✦ ✦</div>
        <div style="color:#d4d4dc;font-size:13px;line-height:1.7;">$2</div>
        <div style="text-align:center;color:#e2b96f;font-size:11px;letter-spacing:6px;padding-top:8px;margin-top:8px;border-top:1px dashed rgba(226,185,111,0.3);">✦ ✦ ✦</div>
        </div>
      来源:
        用户输入: false
        AI输出: true
      作用于:
        仅格式显示: true
        仅格式提示词: false

    - 正则名称: '[不发送]去除小剧场标签'
      id: 6a1b2c3d-8765-4321-9abc-fedcba987654
      启用: true
      查找表达式: /<(小剧场|元剧场)>[\s\S]*?</(小剧场|元剧场)>/gsi
      替换为: ''
      来源:
        用户输入: false
        AI输出: true
      作用于:
        仅格式显示: false
        仅格式提示词: true

# ============================================================
#  使用说明
#
#  1. 将上述两个正则条目（包括缩进）复制到角色卡 index.yaml
#     的 扩展字段.正则 列表中（注意保持 YAML 缩进一致）
#
#  2. 第一个正则 [渲染]小剧场 负责在显示时将小剧场内容
#     渲染为深色剧场风格卡片（仅视觉效果，不影响AI上下文）
#
#  3. 第二个正则 [不发送]去除小剧场标签 负责在发送给AI时
#     彻底移除小剧场标签，避免污染后续对话的提示词
#
#  4. 配合小剧场渲染脚本（小剧场渲染.js）可获得更好的
#     角色名高亮和悬停效果
#
#  5. 小剧场/元剧场格式：
#     [小剧场]  或  [元剧场]
#     [角色名]:（动作）台词内容
#     [角色名]: 台词内容
#     [/小剧场]  或  [/元剧场]
# ============================================================
