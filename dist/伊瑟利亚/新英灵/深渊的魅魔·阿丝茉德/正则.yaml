# ============================================================
#  深渊的魅魔·阿丝茉德 · 对话正则
#  使用方法（与「小圣女索菲亚」完全一致）：
#   1. 在酒馆正则中新建条目，将下方 [渲染] 条目的 查找表达式 填入；
#   2. 将同目录下的「前端渲染.html」全部内容复制为 [渲染] 条目的
#      替换为 模板（模板中的 $1=表情、$2=对话正文，由正则捕获组自动填充）；
#   3. [不发送] 条目负责在发送给 AI 前剥离标签，避免污染后续提示词。
#
#  标签格式：
#     <深渊魅魔阿丝茉德|表情> 对话内容 </深渊魅魔阿丝茉德>
#   例如：
#     <深渊魅魔阿丝茉德|诱惑> 过来，孩子……告诉我你今晚最想要什么。 </深渊魅魔阿丝茉德>
# ============================================================

    - 正则名称: '[渲染]深渊魅魔阿丝茉德对话'
      id: 6a1b2c3d-5555-6666-9abc-fedcba987654
      启用: true
      查找表达式: /<深渊魅魔阿丝茉德\|([^>]+)>([\s\S]*?)<\/深渊魅魔阿丝茉德>/g
      替换为: |-
        （在此粘贴「前端渲染.html」的完整内容作为替换模板，
         模板内的 $1 会被自动填充为捕获组1=表情，$2=捕获组2=对话正文）
      来源:
