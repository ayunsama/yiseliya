# ============================================================
#  盲目的莉莉娅 · 对话正则
#  使用方法（与「小圣女索菲亚」完全一致）：
#   1. 在酒馆正则中新建条目，将下方 [渲染] 条目的 查找表达式 填入；
#   2. 将同目录下的「前端渲染.html」全部内容复制为 [渲染] 条目的
#      替换为 模板（模板中的 $1=表情、$2=对话正文，由正则捕获组自动填充）；
#   3. [不发送] 条目负责在发送给 AI 前剥离标签，避免污染后续提示词。
#
#  标签格式：
#     <盲目的莉莉娅|表情> 对话内容 </盲目的莉莉娅>
#   例如：
#     <盲目的莉莉娅|欣慰> 你选了和书上不一样的路。真好。 </盲目的莉莉娅>
# ============================================================

    - 正则名称: '[渲染]盲目的莉莉娅对话'
      id: 6a1b2c3d-1111-2222-9abc-fedcba987654
      启用: true
      查找表达式: /<盲目的莉莉娅\|([^>]+)>([\s\S]*?)<\/盲目的莉莉娅>/g
      替换为: |-
        （在此粘贴「前端渲染.html」的完整内容作为替换模板，
         模板内的 $1 会被自动填充为捕获组1=表情，$2=捕获组2=对话正文）
      来源:
        用户输入: false
        AI输出: true
      作用于:
        仅格式显示: true
        仅格式提示词: false

    - 正则名称: '[不发送]去除盲目的莉莉娅标签'
      id: 6a1b2c3d-1111-2222-9abc-fedcba987655
      启用: true
      查找表达式: /<盲目的莉莉娅\|[^>]*>[\s\S]*?<\/盲目的莉莉娅>/g
      替换为: ''
      来源:
        用户输入: false
        AI输出: true
      作用于:
        仅格式显示: false
        仅格式提示词: true

# ============================================================
#  纯正则速查（不依赖 YAML，直接用于脚本/代码）：
#   渲染匹配：/<盲目的莉莉娅\|([^>]+)>([\s\S]*?)<\/盲目的莉莉娅>/g
#   去除匹配：/<盲目的莉莉娅\|[^>]*>[\s\S]*?<\/盲目的莉莉娅>/g
# ============================================================
